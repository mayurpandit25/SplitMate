
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: splitmate-frontend-hpa
  namespace: splitmate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: splitmate-frontend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
