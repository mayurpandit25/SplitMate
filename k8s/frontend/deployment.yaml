
apiVersion: apps/v1
kind: Deployment
metadata:
  name: splitmate-frontend
  namespace: splitmate
spec:
  replicas: 2
  selector:
    matchLabels:
      app: splitmate-frontend
  template:
    metadata:
      labels:
        app: splitmate-frontend
    spec:
      containers:
        - name: frontend
          image: YOUR_DOCKER_IMAGE_HERE
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
            
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
